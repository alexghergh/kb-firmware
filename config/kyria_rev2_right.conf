# EC11 encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# No display on this half (the trackpad replaced the OLED); the keymap file
# also disables the shield's oled node, and with ZMK_DISPLAY the default (n)
# the display subsystem stays out of the build

# Pointing device support (Cirque trackpad)
CONFIG_ZMK_POINTING=y

# RGB underglow support (WS2812B)
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=2

# RGB toggling shouldn't cut off external power
# CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

# Increase Bluetooth transmission power for better connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Force battery notifications (circumvent Windows bug)
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# Time to wait before saving changes in memory (10s)
CONFIG_ZMK_SETTINGS_SAVE_DEBOUNCE=10000
