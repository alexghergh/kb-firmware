# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  # nice_view_adapter: upstream adapter for the new nice!view display, replacing
  # the old OLED display; that turns the kyria's 4-pin OLED I2C header into the
  # SPI bus the display needs (SDA->MOSI, SCL->SCK) and sets the CS pin default
  # we override in the left keymap file. nice_view: the display shield itself.
  # Order matters: the adapter must come before nice_view.
  - board: nice_nano//zmk
    shield: kyria_rev2_left nice_view_adapter nice_view
    # TEMPORARY: stream debug logs over USB serial to debug BLE advertising
    snippet: zmk-usb-logging
  - board: nice_nano//zmk
    shield: kyria_rev2_right
    # TEMPORARY: stream debug logs over USB serial to debug the trackpad
    snippet: zmk-usb-logging
  - board: nice_nano//zmk
    shield: settings_reset
